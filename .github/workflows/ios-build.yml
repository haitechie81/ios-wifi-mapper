name: Build iOS WiFiMapper IPA & Run Tests

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift Package Unit Tests (RF Propagation, Occupancy Grid & Optimizer)
        run: swift test

      - name: Generate Xcode Project via XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' WiFiMapper.xcodeproj/project.pbxproj

      - name: Build Unsigned iOS App for Sideloading (AltStore / SideStore / Sideloadly)
        run: |
          xcodebuild clean build \
            -project WiFiMapper.xcodeproj \
            -scheme WiFiMapper \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into installable WiFiMapper.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WiFiMapper.app Payload/
          zip -r9 WiFiMapper-unsigned.ipa Payload

      - name: Upload WiFiMapper.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiMapper-iOS-IPA
          path: WiFiMapper-unsigned.ipa
